name: 中文项目发布检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:history
      - name: 安装校验过的 Gitleaks 并扫描
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" --output "$scanner_dir/scanner.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" --output "$scanner_dir/checksums.txt"
          expected="$(awk -v name="gitleaks_${version}_linux_x64.tar.gz" '$2 == name { print $1 }' "$scanner_dir/checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$scanner_dir/scanner.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/scanner.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --redact=100 --no-banner --ignore-gitleaks-allow
